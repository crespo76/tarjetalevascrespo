<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tarjeta de puesta a punto – Árbol de levas</title>
<style>
.tpl{--ink:#1c1f24;--mut:#5f6772;--line:#c9ced6;--bg:#fff;--acc:#1f4e8c;--adm:#2b7bd6;--esc:#d6452b;
font-family:Verdana,Arial,sans-serif;color:var(--ink);max-width:760px;margin:0 auto;padding:12px;box-sizing:border-box}
.tpl *{box-sizing:border-box}
.tpl .sel{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.tpl .sel label{flex:1 1 200px;font-size:12px;font-weight:bold;color:var(--mut)}
.tpl select{display:block;width:100%;margin-top:4px;padding:10px;font:inherit;font-size:15px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--ink)}
.tpl .card{border:2px solid var(--ink);border-radius:8px;padding:14px;background:var(--bg)}
.tpl h2{margin:0;font-size:17px;text-align:center;letter-spacing:.5px}
.tpl .sub{display:flex;justify-content:space-between;margin:10px 0;font-size:14px;border-bottom:2px solid var(--ink);padding-bottom:8px}
.tpl .sub b{font-size:18px;color:var(--acc)}
.tpl .top{display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.tpl .dia{flex:0 1 318px;margin:0 auto}
.tpl .dia svg{width:100%;height:auto;display:block}
.tpl .kp{flex:1 1 200px;font-size:13px}
.tpl .kp div{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding:6px 0}
.tpl .kp b{color:var(--acc)}
.tpl .kp .logo{display:block;width:100%;max-width:191px;height:auto;margin:0 0 10px auto;position:relative;top:-28px}
.tpl table{width:100%;border-collapse:collapse;margin-top:12px;font-size:13px}
.tpl th,.tpl td{border:1px solid var(--line);padding:6px 8px;text-align:center}
.tpl th{background:#e8ecf2}
.tpl td:first-child{text-align:left;font-weight:bold}
.tpl th.a{color:var(--adm)}.tpl th.e{color:var(--esc)}
.tpl td.m{width:15%;background:#fffbe0}
.tpl .note{font-size:11px;color:var(--mut);margin-top:10px}
.tpl button{margin-top:12px;padding:10px 18px;font:inherit;font-size:14px;border:0;border-radius:6px;background:var(--acc);color:#fff;cursor:pointer}
.tpl .notas{margin-top:12px;border-top:2px solid var(--ink);padding-top:8px;font-size:12px}.tpl .notas ul{margin:6px 0 0;padding-left:18px}.tpl .notas li{margin:3px 0}
.tpl .sk{display:inline-block;width:3.2em;max-width:100%;height:.95em;vertical-align:middle;border-radius:4px;background:linear-gradient(90deg,#e6e9ee 25%,#f3f5f8 50%,#e6e9ee 75%);background-size:200% 100%;animation:tpl-sh 1.2s linear infinite}
.tpl .sk.w{width:9em}.tpl .sk.n{width:4em}
.tpl.err .sk{animation:none}
@keyframes tpl-sh{from{background-position:200% 0}to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){.tpl .sk{animation:none}}
.tpl select:disabled{color:var(--mut);background:#f3f5f8}
.tpl button:disabled{opacity:.5;cursor:default}
.tpl .note a{color:inherit;font-weight:bold}
@media print{body *{visibility:hidden}.tpl .card,.tpl .card *{visibility:visible}.tpl .card{position:absolute;left:0;top:0;width:100%}}
</style></head><body>
<div class="tpl" id="tpl">
 <div class="sel">
  <label>Marca<select id="tpl-m" disabled><option>Cargando…</option></select></label>
  <label>Perfil de árbol<select id="tpl-p" disabled><option>Cargando…</option></select></label>
 </div>
 <div class="card" id="tpl-card"></div>
 <button type="button" id="tpl-pr" onclick="window.print()" disabled>Imprimir tarjeta</button>
 <p class="note" id="tpl-st">Conectando con Google Sheets…</p>
</div>

  var seen={};selP.innerHTML="";
  lst.forEach(function(o){seen[o.r.p]=(seen[o.r.p]||0)+1;
    selP.add(new Option(o.r.p+(cnt[o.r.p]>1?" #"+seen[o.r.p]:""),o.i))});
  if(prev)for(var k=0;k<selP.options.length;k++)if(selP.options[k].text===prev){selP.selectedIndex=k;break}
  draw();
}
function pt(r,a){var t=a*Math.PI/180;return[160+r*Math.sin(t),160-r*Math.cos(t)]}
function arc(r,a0,a1,c){var p=pt(r,a0),q=pt(r,a1);
  return '<path d="M'+p[0].toFixed(1)+' '+p[1].toFixed(1)+' A'+r+' '+r+' 0 '+((a1-a0)>180?1:0)+' 1 '+q[0].toFixed(1)+' '+q[1].toFixed(1)+'" fill="none" stroke="'+c+'" stroke-width="16" opacity=".85"/>'}
function lab(r,a,t,c,inn){var p=pt(r,a),x=p[0],an=x<150?(inn?"start":"end"):x>170?(inn?"end":"start"):"middle";return '<text x="'+x.toFixed(1)+'" y="'+p[1].toFixed(1)+'" font-size="10" font-weight="bold" fill="'+c+'" text-anchor="'+an+'" dominant-baseline="middle">'+t+'</text>'}
function svg(r){
  if([r.aa,r.ca,r.ae,r.ce].some(function(v){return v==null}))return"";
  var s='<svg viewBox="-30 0 350 320" role="img" aria-label="Diagrama de distribución"><circle cx="160" cy="160" r="112" fill="none" stroke="#c9ced6"/>';
  s+='<line x1="160" y1="20" x2="160" y2="300" stroke="#c9ced6"/><line x1="40" y1="160" x2="280" y2="160" stroke="#e1e4e9"/>';
  s+=arc(126,-r.aa,180+r.ca,"#2b7bd6")+arc(98,180-r.ae,360+r.ce,"#d6452b");
  s+='<text x="160" y="12" text-anchor="middle" font-size="11" font-weight="bold">PMS</text><text x="160" y="316" text-anchor="middle" font-size="11" font-weight="bold">PMI</text>';
  s+=lab(146,-r.aa-5,"AAA "+r.aa+"°","#2b7bd6")+lab(146,180+r.ca+5,"RCA "+r.ca+"°","#2b7bd6");
  s+=lab(76,180-r.ae-6,"AAE "+r.ae+"°","#d6452b",1)+lab(76,360+r.ce+6,"RCE "+r.ce+"°","#d6452b",1);
  s+='<text x="160" y="154" text-anchor="middle" font-size="10" fill="#2b7bd6" font-weight="bold">● ADMISIÓN</text><text x="160" y="170" text-anchor="middle" font-size="10" fill="#d6452b" font-weight="bold">● ESCAPE</text></svg>';
  return s}
function draw(){var r=D[selP.value];if(r)card(r)}
function skel(){card({m:"",p:""},1)}
function card(r,sk){
  var fm=sk?function(){return'<span class="sk"></span>'}:window.tplFm;
  var icl=r.da!=null&&r.aa!=null?r.da/2-r.aa:null,ecl=r.de!=null&&r.ce!=null?r.de/2-r.ce:null;
  var cruce=r.aa!=null&&r.ce!=null?r.aa+r.ce:null;
  var rows=[["Duración (°)",fm(r.da),fm(r.de)],["Apertura AAA / AAE (°)",fm(r.aa),fm(r.ae)],["Cierre RCA / RCE (°)",fm(r.ca),fm(r.ce)],
   ["Luz de válvula (mm)",fm(r.la),fm(r.le)],["Duración @1 mm (°)",fm(r.d1a),fm(r.d1e)],["Alzada en PMS (mm)",fm(r.pa),fm(r.pe)],
   ["Área (mm × grado²)",fm(r.ara),fm(r.are)],["Centro de leva (°)",fm(icl,1),fm(ecl,1)]];
  var t='<table><tr><th>Parámetro</th><th class="a">ADMISIÓN</th><th>Medido</th><th class="e">ESCAPE</th><th>Medido</th></tr>';
  rows.forEach(function(x){t+='<tr><td>'+x[0]+'</td><td>'+x[1]+'</td><td class="m"></td><td>'+x[2]+'</td><td class="m"></td></tr>'});
  t+='</table>';
  $("tpl-card").innerHTML='<h2>TARJETA DE PUESTA A PUNTO – ÁRBOL DE LEVAS</h2><div class="sub"><span>'+(sk?'<span class="sk w"></span>':r.m)+'</span><b>'+(sk?'<span class="sk n"></span>':r.p)+'</b></div>'+
   '<div class="top"><div class="dia">'+(sk?'<svg viewBox="-30 0 350 320" aria-hidden="true"><circle cx="160" cy="160" r="112" fill="none" stroke="#e6e9ee" stroke-width="16"/></svg>':svg(r))+'</div><div class="kp"><img class="logo" src="'+LOGO+'" width="640" height="180" alt="Levas Crespo"><div><span>E.C. (ángulo entre ejes)</span><b>'+fm(r.ec,1)+'°</b></div>'+
   '<div><span>Alzada de leva</span><b>'+(typeof r.al==='number'?fm(r.al,2):fm(r.al))+' mm</b></div><div><span>Alzada de válvula</span><b>'+(typeof r.av==='number'?fm(r.av,2):fm(r.av))+' mm</b></div><div><span>Relación de balancín</span><b>'+fm(r.rb)+'</b></div><div><span>Cruce de válvulas</span><b>'+fm(cruce)+'°</b></div>'+
   '<div><span>Centro de leva ADM / ESC</span><b>'+fm(icl,1)+'° / '+fm(ecl,1)+'°</b></div></div></div>'+t+
   '<p class="note">AAA/RCA: apertura antes y cierre después del PMI en admisión. AAE/RCE: apertura antes del PMI y cierre después del PMS en escape. '+
   'HID = taqué hidráulico. “—” = dato no disponible. Valores de catálogo; las columnas amarillas son para anotar lo medido.</p>'+
   '<div class="notas"><b>Notas</b><ul><li>Reglaje en funcionamiento con la luz de válvula indicada y una apertura de válvula de 0.01 mm.</li>'+
   '<li>Los perfiles para botador hidráulico se miden con una apertura de válvula de 0.16 mm.</li></ul></div>';
}
function csv(t){var R=[],r=[],c="",q=false,i=0,ch;
  for(;i<t.length;i++){ch=t.charAt(i);
    if(q){if(ch==='"'){if(t.charAt(i+1)==='"'){c+='"';i++}else q=false}else c+=ch}
    else if(ch==='"')q=true;else if(ch===","){r.push(c);c=""}
    else if(ch==="\n"||ch==="\r"){if(ch==="\r"&&t.charAt(i+1)==="\n")i++;r.push(c);c="";R.push(r);r=[]}else c+=ch}
  if(c!==""||r.length){r.push(c);R.push(r)}return R}
function V(x,mil){if(x==null)return null;x=String(x).trim();if(!x)return null;
  if(/^\d{1,4}[\/\-]\d{1,2}[\/\-]\d{1,4}$/.test(x))return null;
  if(mil&&/^\d{1,3}(\.\d{3})+$/.test(x))x=x.replace(/\./g,"");
  if(/^-?\d+([.,]\d+)?$/.test(x))return parseFloat(x.replace(",","."));return x}
function T(x,mil){var s=V(x,mil);if(s==null)return null;x=String(x).trim();if(mil&&/^\d{1,3}(\.\d{3})+$/.test(x))x=x.replace(/\./g,"");return typeof s==="number"?x.replace(",",".").replace(/^(-?)0(\d)\./,"$1$2."):s}
function reg(x){var a=String(x||"").split("-");var p=parseInt(a[0],10),q=parseInt(a[1],10);return a.length===2&&!isNaN(p)&&!isNaN(q)?[p,q]:[null,null]}
function mapRows(R){var out=[],prev=null;
  R.forEach(function(r,ix){if(ix===0&&/marca/i.test(r[0]))return;var m=(r[0]||"").trim();if(!m)return;
    var mm=m.match(/^(.*\D)\s(\d+)$/);
    if(mm&&prev&&prev.pre===mm[1]&&prev.n+1===+mm[2]){m=prev.grp;prev={pre:mm[1],n:+mm[2],grp:m}}
    else prev=mm?{pre:mm[1],n:+mm[2],grp:m}:null;
    var a=reg(r[3]),e=reg(r[9]);
    out.push({m:m,p:(r[1]||"").trim()||"s/d",da:V(r[2]),aa:a[0],ca:a[1],la:T(r[4]),d1a:T(r[5]),pa:T(r[6]),ara:T(r[7],1),
      de:V(r[8]),ae:e[0],ce:e[1],le:T(r[10]),d1e:T(r[11]),pe:T(r[12]),are:T(r[13],1),ec:T(r[14]),al:T(r[15]),av:T(r[16]),rb:T(r[17])})});
  return out}
function st(t,w){var e=$("tpl-st");if(e){e.textContent=t;e.style.color=w?"#b26a00":""}}
function live(n){n=n||0;var tpl=$("tpl");tpl.classList.remove("err");if(!n)st("Conectando con Google Sheets…");
  var ctl=window.AbortController?new AbortController():null,to=setTimeout(function(){if(ctl)ctl.abort()},15000);
  fetch(URL_CSV+"&_="+Date.now(),{cache:"no-store",signal:ctl?ctl.signal:undefined}).then(function(r){if(!r.ok)throw new Error("HTTP "+r.status);return r.text()}).then(function(t){
    clearTimeout(to);if(/^\s*</.test(t))throw new Error("la hoja no está publicada como CSV");var rows=mapRows(csv(t));if(!rows.length)throw new Error("la hoja está vacía");
    D=rows;selM.disabled=selP.disabled=false;$("tpl-pr").disabled=false;marcasInit();perfiles(1);st("Datos en vivo desde Google Sheets · "+rows.length+" perfiles")
  }).catch(function(e){clearTimeout(to);if(window.console)console.error("Google Sheets:",e);
    if(n<2){st("Reintentando conexión con Google Sheets…");setTimeout(function(){live(n+1)},1000*(n+1));return}
    tpl.classList.add("err");
    var e2=$("tpl-st");e2.innerHTML="No se pudo cargar la base de datos de Google Sheets"+(location.protocol==="file:"?" (el navegador puede bloquear la conexión al abrir el archivo localmente: publíquelo en un sitio web)":"")+". <a href=\"#\" id=\"tpl-re\">Reintentar</a>";e2.style.color="#b3261e";
    $("tpl-re").onclick=function(ev){ev.preventDefault();live()}})}
selM.onchange=function(){perfiles()};selP.onchange=draw;skel();live();
})();
</script></body></html>
