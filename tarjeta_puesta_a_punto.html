  var cnt={};lst.forEach(function(o){cnt[o.r.p]=(cnt[o.r.p]||0)+1});
  var seen={};selP.innerHTML="";
  lst.forEach(function(o){seen[o.r.p]=(seen[o.r.p]||0)+1;
    selP.add(new Option(o.r.p+(cnt[o.r.p]>1?" #"+seen[o.r.p]:""),o.i))});
  draw();
}
function pt(r,a){var t=a*Math.PI/180;return[160+r*Math.sin(t),160-r*Math.cos(t)]}
function arc(r,a0,a1,c){var p=pt(r,a0),q=pt(r,a1);
  return '<path d="M'+p[0].toFixed(1)+' '+p[1].toFixed(1)+' A'+r+' '+r+' 0 '+((a1-a0)>180?1:0)+' 1 '+q[0].toFixed(1)+' '+q[1].toFixed(1)+'" fill="none" stroke="'+c+'" stroke-width="16" opacity=".85"/>'}
function lab(r,a,t,c,inn){var p=pt(r,a),x=p[0],an=x<150?(inn?"start":"end"):x>170?(inn?"end":"start"):"middle";return '<text x="'+x.toFixed(1)+'" y="'+p[1].toFixed(1)+'" font-size="10" font-weight="bold" fill="'+c+'" text-anchor="'+an+'" dominant-baseline="middle">'+t+'</text>'}
function svg(r){
  if([r.aa,r.ca,r.ae,r.ce].some(function(v){return v==null}))return"";
  var s='<svg viewBox="-30 0 350 320" role="img" aria-label="Diagrama de distribución"><circle cx="160" cy="160" r="112" fill="none" stroke="#c9ced6"/>';
  s+='<line x1="160" y1="20" x2="160" y2="300" stroke="#c9ced6"/><line x1="40" y1="160" x2="280" y2="160" stroke="#e1e4e9"/>';
  s+=arc(126,-r.aa,180+r.ca,"#2b7bd6")+arc(98,180-r.ae,360+r.ce,"#d6452b");
  s+='<text x="160" y="12" text-anchor="middle" font-size="11" font-weight="bold">PMS</text><text x="160" y="316" text-anchor="middle" font-size="11" font-weight="bold">PMI</text>';
  s+=lab(146,-r.aa-5,"AAA "+r.aa+"°","#2b7bd6")+lab(146,180+r.ca+5,"RCA "+r.ca+"°","#2b7bd6");
  s+=lab(76,180-r.ae-6,"AAE "+r.ae+"°","#d6452b",1)+lab(76,360+r.ce+6,"RCE "+r.ce+"°","#d6452b",1);
  s+='<text x="160" y="154" text-anchor="middle" font-size="10" fill="#2b7bd6" font-weight="bold">● ADMISIÓN</text><text x="160" y="170" text-anchor="middle" font-size="10" fill="#d6452b" font-weight="bold">● ESCAPE</text></svg>';
  return s}
function draw(){
  var r=D[selP.value];if(!r)return;
  var icl=r.da!=null&&r.aa!=null?r.da/2-r.aa:null,ecl=r.de!=null&&r.ce!=null?r.de/2-r.ce:null;
  var cruce=r.aa!=null&&r.ce!=null?r.aa+r.ce:null;
  var rows=[["Duración (°)",fm(r.da),fm(r.de)],["Apertura AAA / AAE (°)",fm(r.aa),fm(r.ae)],["Cierre RCA / RCE (°)",fm(r.ca),fm(r.ce)],
   ["Luz de válvula (mm)",fm(r.la),fm(r.le)],["Duración @1 mm (°)",fm(r.d1a),fm(r.d1e)],["Alzada en PMS (mm)",fm(r.pa),fm(r.pe)],
   ["Área",fm(r.ara),fm(r.are)],["Centro de leva (°)",fm(icl,1),fm(ecl,1)]];
  var t='<table><tr><th>Parámetro</th><th class="a">ADMISIÓN</th><th>Medido</th><th class="e">ESCAPE</th><th>Medido</th></tr>';
  rows.forEach(function(x){t+='<tr><td>'+x[0]+'</td><td>'+x[1]+'</td><td class="m"></td><td>'+x[2]+'</td><td class="m"></td></tr>'});
  t+='</table>';
  $("tpl-card").innerHTML='<h2>TARJETA DE PUESTA A PUNTO – ÁRBOL DE LEVAS</h2><div class="sub"><span>'+r.m+'</span><b>'+r.p+'</b></div>'+
   '<div class="top"><div class="dia">'+svg(r)+'</div><div class="kp"><img class="logo" src="'+LOGO+'" alt="Levas Crespo"><div><span>E.C. (ángulo entre ejes)</span><b>'+fm(r.ec,1)+'°</b></div>'+
   '<div><span>Alzada de leva</span><b>'+(typeof r.al==='number'?fm(r.al,2):fm(r.al))+' mm</b></div><div><span>Alzada de válvula</span><b>'+(typeof r.av==='number'?fm(r.av,2):fm(r.av))+' mm</b></div><div><span>Relación de balancín</span><b>'+fm(r.rb)+'</b></div><div><span>Cruce de válvulas</span><b>'+fm(cruce)+'°</b></div>'+
   '<div><span>Centro de leva ADM / ESC</span><b>'+fm(icl,1)+'° / '+fm(ecl,1)+'°</b></div></div></div>'+t+
   '<p class="note">AAA/RCA: apertura antes y cierre después del PMI en admisión. AAE/RCE: apertura antes del PMI y cierre después del PMS en escape. '+
   'HID = taqué hidráulico. “—” = dato no disponible. Valores de catálogo; las columnas amarillas son para anotar lo medido.</p>'+
   '<div class="notas"><b>Notas</b><ul><li>Reglaje en funcionamiento con la luz de válvula indicada y una apertura de válvula de 0.01 mm.</li>'+
   '<li>Área: mm × grado².</li><li>Los perfiles para botador hidráulico se miden con una apertura de válvula de 0.16 mm.</li></ul></div>';
}
selM.onchange=perfiles;selP.onchange=draw;perfiles();
})();
</script></body></html>
